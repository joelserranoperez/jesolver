# PostgreSQL local para desarrollo: docker compose up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: planificador
      POSTGRES_PASSWORD: planificador   # solo para desarrollo local
      POSTGRES_DB: planificador
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
